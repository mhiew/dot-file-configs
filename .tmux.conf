# this requires
# tmux - brew install tmux
# tmux plugin - brew install tpm

# use <C-a>I to install tpm plugins within tmux

set -g default-terminal "xterm-256color"

set-option -sa terminal-overrides ",xterm*:Tc"
set -as terminal-overrides ",xterm*:Tc"
set -as terminal-overrides ",256col*:Tc"

set -g status-position top
set-option -g status-right ""

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'dracula/tmux'

# enable auto save of sessions
set -g @continuum-restore 'on'
# Change save interval to 5 minutes (default is 15)
set -g @continuum-save-interval '5'

# theming
set -g @dracula-plugins " "

# Active pane: Dracula background (Dark Grey)
set -g window-active-style 'fg=terminal,bg=#282a36'
# Inactive panes: Dracula Selection Grey (Muted)
set -g window-style 'fg=terminal,bg=#1e1f29'
# Muted border for black panes
set -g pane-border-style 'fg=#44475a,bg=#000000'       
# Bright Cyanborder for active Dracula grey
set -g pane-active-border-style 'fg=#8be9fd,bg=#282a36' 

# Pass through extended key sequences (e.g. Shift+Enter) to applications
# Only send CSI u sequences to apps that request extended key mode (e.g. Claude Code)
# rather than always, which causes raw sequences in the shell for keys like Shift+Backspace
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# change prefix from <C-b> to <C-a>
unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g status-interval 1
set-option -g automatic-rename on

# WINDOW TAB FORMATTING
# Use prefix+T to clear the tab title override and revert to dynamic naming.
#
# Colour by directory name:
#   android-register -> RED | b-android-register -> ORANGE | c-android-register -> GREEN | else -> GREEN
# Then choose content:
#   If @tab_title is set  -> show the tab title (dark text when Claude is thinking, else keeps directory colour)
#   If @tab_title not set -> show "command - directory" (dark text when Claude thinking, white otherwise)
#
# (Note: For tmux 3.7+ plaintext safety, style tags are evaluated cleanly via post-TPM hooks below)
set-option -g automatic-rename-format '#{?@tab_title,#{@tab_title},#{pane_current_command} - #{b:pane_current_path}}'

# start indexes from 1
set -g base-index 1
set -g renumber-windows on

# don't exit from tmux when closing a session
set -g detach-on-destroy off

# enter copy mode on mouse scroll. this exits when scrolled back to bottom or we press q.
setw -g mouse on

## Show Pane index and title
set -g pane-border-status top

# 1. Show Zoomed status if active
# 2. Show @pane_title if set, otherwise fall back to #T (the default title)
set -g pane-border-format "#{?pane_active,#[fg=#8be9fd]#[bold]#{?window_zoomed_flag,#[fg=#ffb86c][ ZOOMED ] ,} [ ###P: #{?@pane_title,#{@pane_title},#T} ] ,#[fg=#6272a4] [ ###P: #{?@pane_title,#{@pane_title},#T} ] }"

# KEYBINDS
# use vi irection keys in copy mode
setw -g mode-keys vi
# use v to trigger something like visual mode in copy mode
bind -T copy-mode-vi v send -X begin-selection
# use y to yank to clipboard and cancel copy mode
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
#use p to paste like in vi
bind P paste-buffer
# allows us to drag and copy then release left mouse button to copy in copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind r source-file ~/.tmux.conf \; display "Reloaded!"

### WINDOW MANAMGENT
# open windows and panes in cwd
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -a -c "#{pane_current_path}"

# rebind next and previous window and last-window
bind h previous-window
bind l next-window
bind k last-window

# Shift current tab (window) LEFT with Prefix + Left Arrow
# The -r allows you to tap the arrow multiple times without hitting the prefix again
bind-key -r Left swap-window -d -t -1

# Shift current tab (window) RIGHT with Prefix + Right Arrow
# The -r allows you to tap the arrow multiple times without hitting the prefix again
bind-key -r Right swap-window -d -t +1

### PANE MANAGEMENT
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-active-border-style "fg=cyan,bg=#282a36" 
set -g window-style 'fg=terminal,bg=#111217' 

# Enable the scrollbar for all panes
set -g pane-scrollbars on
set -g pane-scrollbars-position right
set -g pane-scrollbars-style 'fg=#6272a4,bg=#282a36'
set -g pane-scrollbars modal

# prefix + q will now stay until you pick or cancel
bind q display-panes -d 0

# rebind split keys to Prefix + | and -  the panes keep cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move between panes with Prefix + Ctrl + vim keys
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

# Prefix + t to rename the current pane
# After setting the pane title, a background shell syncs pane 1's @pane_title
# to the window-level @tab_title option (used by automatic-rename-format above).
# Escaping notes: \$ prevents tmux expanding shell vars during config parse,
# ## in ##{@pane_title} produces a literal #{@pane_title} after format expansion
# so the inner `tmux display-message` resolves it against pane 1's context.
# The automatic-rename toggle at the end forces tmux to recompute the tab name immediately.
bind t command-prompt -p "Enter pane title:" \
  "set -p @pane_title '%%' ; run-shell -b 'title=\$(tmux display-message -p -t \"#{session_name}:#{window_index}.1\" \"##{@pane_title}\" 2>/dev/null); if [ -n \"\$title\" ]; then tmux set-option -w @tab_title \"\$title\"; else tmux set-option -wu @tab_title 2>/dev/null; fi; tmux set-option -w automatic-rename off; tmux set-option -w automatic-rename on'"

# Prefix + T to clear the tab title override (revert to dynamic naming)
bind T set-option -wu @tab_title \; display "Tab title override cleared"

# Prefix + b to "Break" the pane out into its own window
bind b break-pane

# Prefix + j to "Join" a window into the current one as a vertical split
bind j command-prompt -p "Join window from:"  "join-pane -h -s '%%'"

# Press Prefix + f to "flip" the layout between horizontal and vertical
bind f next-layout

# tpm uninstall using <C-a> u
set -g @tpm-clean 'u'

run '/opt/homebrew/opt/tpm/share/tpm/tpm'

# ==========================================
# POST-TPM OVERRIDES & STATUS CLEANUP (Must be at the bottom)
# ==========================================
# Explicit styles that force Dracula layouts into correct baseline structures
set -g window-status-format "#[fg=#f8f8f2]#[bg=#44475a] #I #W "
set -g window-status-current-format "#[fg=#f8f8f2]#[bg=#282a36]#[bold] #I #W "

# Clean up status line background leakage and green gap separators
set -g status-style bg="#44475a",fg="#f8f8f2"
set -g window-status-separator "#[bg=#44475a] "

# CLAUDE CODE TAB NOTIFICATIONS (must be AFTER tpm/dracula to avoid being overridden)
# Works with hooks in ~/.claude/settings.json:
#   - UserPromptSubmit hook sets @claude_thinking=1 (Claude is processing)
#   - Stop hook sets @claude_done=1 (Claude finished, needs attention)
#
# Tab colours (non-active windows only):
#   - Orange (#ffb86c) + dark text: Claude is thinking/processing
#   - Purple (#6c5ce7) + white text: Claude is done, needs your attention
#   - Grey (#44475a) + white text:   default (no Claude activity)
#
# Focusing the window clears both flags automatically.
set-hook -g session-window-changed "set-window-option -q @claude_done 0 \; set-window-option -q @claude_thinking 0"

# Re-sync tab title when a pane exits (clears stale @tab_title if pane 1 is gone)
# Same sync logic as bind t above — reads pane 1's title and updates @tab_title.
set-hook -g pane-exited "run-shell -b 'title=\$(tmux display-message -p -t \"#{session_name}:#{window_index}.1\" \"##{@pane_title}\" 2>/dev/null); if [ -n \"\$title\" ]; then tmux set-option -w @tab_title \"\$title\"; else tmux set-option -wu @tab_title 2>/dev/null; fi; tmux set-option -w automatic-rename off; tmux set-option -w automatic-rename on'"
